services:
  - type: web
    name: fire-before-fire-cloud
    runtime: node
    rootDir: cloud
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLOUD_API_KEY
        sync: false
      - key: DEFAULT_DEVICE_ID
        value: esp32-01
      - key: NODE_VERSION
        value: "20"
